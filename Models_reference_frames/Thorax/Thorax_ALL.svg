        <text x="0" y="18" fill="#16a34a" class="note-lbl">Y : mid(PX, T10) → mid(C7, IJ)</text>
        <text x="0" y="36" fill="#2563eb" class="note-lbl">Z : ⊥ (C7 → IJ)</text>
        <text x="0" y="54" fill="#dc2626" class="note-lbl">X = Y × Z</text>
      </g>
    </g>
  </g>

  
